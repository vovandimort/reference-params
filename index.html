<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Передача параметрів за посиланням</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one column, sticky step bar on top, fixed prev/next bar at the bottom */
  --bg:#f1f5f6; --surface:#ffffff; --ink:#14232b; --muted:#566972; --line:#d6e0e4;
  --accent:#0b6e6e; --accent-ink:#ffffff; --accent-soft:#dcf0ef;
  --warm:#a84f08; --warm-soft:#fcecd6;
  --good:#17803d; --good-soft:#dcf3e3; --bad:#b42323; --bad-soft:#fbe0e0;
  --code-bg:#10222a; --code-ink:#e6f1f2; --code-dim:#6f8993; --code-kw:#7dd3c8; --code-num:#f6c177; --code-c:#7f98a2; --code-hl:#1d3f4a; --amp:#ffb454;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b1418; --surface:#13222a; --ink:#e4eef0; --muted:#93a8b0; --line:#25383f;
    --accent:#4fd1c5; --accent-ink:#06201f; --accent-soft:#143a3b;
    --warm:#f5a85a; --warm-soft:#3a2a14;
    --good:#4ade80; --good-soft:#12301d; --bad:#f87171; --bad-soft:#3a1717;
    --code-bg:#08110f; --code-hl:#1b3a44;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b1418; --surface:#13222a; --ink:#e4eef0; --muted:#93a8b0; --line:#25383f;
  --accent:#4fd1c5; --accent-ink:#06201f; --accent-soft:#143a3b;
  --warm:#f5a85a; --warm-soft:#3a2a14;
  --good:#4ade80; --good-soft:#12301d; --bad:#f87171; --bad-soft:#3a1717;
  --code-bg:#08110f; --code-hl:#1b3a44;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{font-weight:800;line-height:1.2;text-wrap:balance;margin:0 0 .5em}
h1{font-size:1.65rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0 0 .8em}
code,.mono{font-family:var(--f-mono);font-size:.92em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 0 0}
.hd-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px 6px;max-width:760px;margin:0 auto}
.hd-top b{font-size:.8rem;letter-spacing:.02em;color:var(--muted);font-weight:600}
.status{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.status.off{background:var(--warm-soft);color:var(--warm)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;max-width:760px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:5px 12px;font:600 .8rem var(--f-body);cursor:pointer;min-height:32px}
.chip[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.done{color:var(--ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
main{max-width:760px;margin:0 auto;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
#banner{max-width:760px;margin:0 auto;padding:10px 16px 0}
.banner{background:var(--warm-soft);color:var(--warm);border-radius:10px;padding:10px 12px;font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card>*{margin:0}
.lead{color:var(--muted);font-size:1.02rem}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
ul.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--accent-soft);color:var(--accent);font-weight:700}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
.btn{font:700 1rem var(--f-body);min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],input[type=number],textarea{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
textarea{min-height:140px;font-family:var(--f-mono);font-size:.9rem;line-height:1.5;resize:vertical}
input.sm{width:92px;text-align:center;font-family:var(--f-mono)}
label{font-weight:600;font-size:.92rem}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:10px 0;overflow-x:auto;font-family:var(--f-mono);font-size:.84rem;line-height:1.6}
.code .ln{display:flex;white-space:pre;padding:0 12px 0 0;min-width:max-content}
.code .ln.on{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--amp)}
.code .no{color:var(--code-dim);width:34px;text-align:right;padding-right:12px;flex:0 0 34px;user-select:none}
.code .k{color:var(--code-kw)} .code .n{color:var(--code-num)} .code .c{color:var(--code-c)} .code .amp{color:var(--amp);font-weight:700}
.qt{font-weight:700;margin:0 0 8px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt .mk{flex:0 0 26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font:700 .8rem var(--f-mono);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mk{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);opacity:.8}
.fb{font-size:.92rem;margin-top:8px}.fb:empty{display:none}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.quiz+.quiz{border-top:1px dashed var(--line);padding-top:14px}
.timer{position:sticky;top:var(--hh,96px);z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}
.timer .t{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.timer.low .t{color:var(--bad)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:700 .88rem var(--f-body);padding:0 14px;min-height:44px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.vm button[aria-pressed="true"]{background:var(--warm);color:#fff}
.seg.good button[aria-pressed="true"]{background:var(--good);color:#fff}
.seg.bad button[aria-pressed="true"]{background:var(--bad);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.analogy{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.analogy.v{background:var(--warm-soft);color:var(--ink)} .analogy.r{background:var(--accent-soft);color:var(--ink)}
.analogy b{font-size:1rem}
.mem{display:flex;flex-direction:column;gap:10px}
.frame{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.frame h4{margin:0 0 8px;font:600 .78rem var(--f-mono);color:var(--muted)}
.cells{display:flex;gap:10px;flex-wrap:wrap}
.box{min-width:78px;text-align:center;border:2px solid var(--ink);border-radius:10px;padding:4px 10px 6px;background:var(--surface)}
.box .lb{font:600 .74rem var(--f-mono);color:var(--muted)}
.box .vl{font:700 1.4rem var(--f-mono);font-variant-numeric:tabular-nums}
.box.cp{border-color:var(--warm)} .box.al{border-color:var(--accent);border-style:dashed;background:var(--accent-soft)}
.box.flash{animation:fl .8s}
@keyframes fl{0%{box-shadow:0 0 0 0 var(--amp)}40%{box-shadow:0 0 0 6px var(--amp)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.box.flash{animation:none;outline:3px solid var(--amp)}}
.empty{color:var(--muted);font-size:.88rem}
.out{font:600 .9rem var(--f-mono);background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:8px 12px;min-height:38px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:0;font-size:.92rem;min-height:3.4em}
.sim.vm .note{background:var(--warm-soft)}
details{border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface)}
details>summary{cursor:pointer;font-weight:700;padding:12px 0;min-height:44px}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details>div{padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
.slot{font:700 .95rem var(--f-mono);min-width:34px;height:30px;margin:0 2px;border-radius:7px;border:1.5px dashed var(--amp);background:transparent;color:var(--amp);cursor:pointer}
.slot.on{background:var(--amp);color:#10222a;border-style:solid}
.fixcode{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:12px;font:.86rem/2.1 var(--f-mono);overflow-x:auto;white-space:pre}
.fixcode .k{color:var(--code-kw)}
.pill{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:99px}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.no{background:var(--bad-soft);color:var(--bad)} .pill.wait{background:var(--warm-soft);color:var(--warm)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--accent-soft);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font:700 1.4rem var(--f-mono)} .stat span{font-size:.76rem;color:var(--muted)}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nv{max-width:760px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.nv .hint{grid-column:1/-1;font-size:.78rem;color:var(--muted);text-align:center;margin:0}
.nv .hint:empty{display:none}
</style>
</head>
<body>
<header id="hd">
  <div class="hd-top"><b>ІНФОРМАТИКА · 10 КЛАС · C++</b><span id="status" class="status off">Підключення…</span></div>
  <div class="chips" id="chips" role="tablist" aria-label="Етапи уроку"></div>
  <div class="bar"><i id="prog" style="width:0"></i></div>
</header>
<div id="banner"></div>
<main id="main"></main>
<nav id="nav"><div class="nv">
  <button class="btn" id="prev" type="button">Назад</button>
  <button class="btn primary" id="next" type="button">Далі</button>
  <p class="hint" id="hint"></p>
</div></nav>

<script>
"use strict";
/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hl(src){
  return esc(src).replace(/(\/\/.*$)|\b(void|int|return|if|else|cout|using|namespace|std|bool|double|for|while)\b|\b(\d+)\b|(&amp;)/g,
    function(m,c,k,n){ return c?'<span class="c">'+c+'</span>':k?'<span class="k">'+k+'</span>':n?'<span class="n">'+n+'</span>':'<span class="amp">&amp;</span>'; });
}
function h(tag,props){
  var e=document.createElement(tag);
  if(props) Object.keys(props).forEach(function(k){
    var v=props[k];
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,'');
    else if(v!==false&&v!=null) e.setAttribute(k,v);
  });
  var kids=Array.prototype.slice.call(arguments,2);
  (function add(list){ list.forEach(function(c){ if(Array.isArray(c)) return add(c); if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(String(c))); }); })(kids);
  return e;
}
function codeBlock(lines,o){
  o=o||{}; var d=h('div',{class:'code'});
  lines.forEach(function(ln,i){
    d.append(h('div',{class:'ln'+(o.hl&&o.hl.indexOf(i+1)>=0?' on':'')},h('span',{class:'no'},String(i+1)),h('span',{class:'tx',html:hl(ln)||'&nbsp;'})));
  });
  return d;
}
function card(){ return h.apply(null,['div',{class:'card'}].concat([].slice.call(arguments))); }
function hash(s){var x=0;for(var i=0;i<s.length;i++){x=(x*31+s.charCodeAt(i))>>>0;}return x;}
function workNo(id){return 100+hash(id)%900;}

/* ---------- content ---------- */
var TQ=[
 {prompt:'Що виведе програма?',code:['void f(int x) { x = x + 5; }','','int main() {','    int a = 3;','    f(a);','    cout << a;','}'],options:['3','8','5','Помилка компіляції'],correct:0},
 {prompt:'У виклику sum(a, 5) що є аргументами?',options:['Лише a','a і 5','int a та int b із заголовка функції','sum'],correct:1},
 {prompt:'Яке значення має вираз sq(4) + sq(2)?',code:['int sq(int x) {','    return x * x;','}'],options:['18','20','36','12'],correct:1},
 {prompt:'Що відбувається після виконання оператора return у функції?',options:['Функція завершується, рядки після return не виконуються','Функція продовжує роботу і виконує решту рядків','Завершується вся програма','Значення return ігнорується'],correct:0},
 {prompt:'Напишіть функцію int maxOf(int a, int b), яка повертає більше з двох чисел.',open:true}
];
var REF_OPEN=['int maxOf(int a, int b) {','    if (a > b) return a;','    return b;','}'];
var DEMOS={
 demoA:{no:417,answers:[0,1,2,0],open:'int maxOf(int a, int b) {\n    if (a > b) return a;\n    else return b;\n}'},
 demoB:{no:238,answers:[1,1,1,0],open:'int maxOf(a, b) {\n    if (a > b) return a\n    return b;\n}'}
};
var STEPS=['Старт','Тест','Перевірка','Проблема','Тема','Практика','Підсумок','Домашнє','Вчителю'];

/* ---------- state ---------- */
var LS='sw-lesson-v2';
var S={step:0,name:'',uid:null,localId:'u'+Math.random().toString(36).slice(2,10),online:false,dbReady:false,isTeacher:false,isOwner:false,readonly:false,
  test:{started:false,submitted:false,answers:[null,null,null,null],open:'',endsAt:0,auto:0},
  review:{target:null,done:false,marks:[],open:null,comment:'',match:0},
  light:null,reflection:'',done:{},tsub:null,myres:[],tdata:null,tpass:'',cache:{},mode2:null};
function save(){try{localStorage.setItem(LS,JSON.stringify({name:S.name,localId:S.localId,test:S.test,review:S.review,light:S.light,reflection:S.reflection}));}catch(e){}}
(function(){try{var d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.name=d.name||'';S.localId=d.localId||S.localId;S.test=d.test||S.test;S.review=d.review||S.review;S.light=d.light||null;S.reflection=d.reflection||'';}}catch(e){}})();
function myId(){return S.uid||S.localId;}
function total(){return S.isTeacher?STEPS.length:STEPS.length-1;}
function autoScore(a){var n=0;for(var i=0;i<4;i++)if(a[i]===TQ[i].correct)n++;return n;}

function gateMsg(step){
  if(S.isTeacher) return '';
  if(step>=1&&!S.name.trim()) return 'Введіть ім’я на стартовому кроці.';
  if(step>=2&&!S.test.submitted) return 'Спочатку здайте тест.';
  if(step>=3&&!S.review.done) return 'Спочатку перевірте роботу однокласника.';
  return '';
}

/* ---------- server (Google Apps Script) ---------- */
var API='PASTE_WEB_APP_URL_HERE';
function banner(msg){var b=document.getElementById('banner');b.innerHTML='';if(msg)b.append(h('div',{class:'banner'},msg));}
function setStatus(){var s=document.getElementById('status');
  if(S.online){s.textContent='Онлайн: взаємоперевірка активна';s.className='status';}
  else{s.textContent='Автономний режим';s.className='status off';}}
async function api(action,data){
  var r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},data||{}))});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
async function safeCall(action,data,quiet){
  try{return await api(action,data);}
  catch(e){
    console.warn(e);
    if(!quiet){S.online=false;setStatus();banner('Немає зв’язку із сервером. Урок працює в автономному режимі: відповіді не зберігаються, а перевірка демонстраційна.');}
    return null;
  }
}
function saveProfile(){
  if(!S.online)return Promise.resolve();
  return safeCall('profile',{uid:S.uid,name:S.name,light:S.light||'',reflection:S.reflection||''},true);
}
async function initCaps(){
  S.isTeacher=location.hash==='#teacher';
  S.uid=S.localId;
  S.online=/^https?:\/\//.test(API);
  setStatus();buildChips();updateNav();
  if(S.online){
    var p=await safeCall('ping',{},true);
    if(!p||!p.ok){S.online=false;setStatus();banner('Сервер недоступний. Урок працює в автономному режимі з демонстраційною перевіркою.');}
  }else{banner('Сервер не підключено (не вказано адресу в константі API). Працює демонстраційний режим.');}
  if(S.test.started&&!S.test.submitted&&S.test.endsAt&&Date.now()>S.test.endsAt)submitTest();
  if(S.step===2)refresh2();
}

/* ---------- reusable widgets ---------- */
function quizItem(o){
  var solved=false;
  var fb=h('div',{class:'fb',role:'status','aria-live':'polite'});
  var btns=o.options.map(function(t,i){
    return h('button',{type:'button',class:'opt',onclick:function(){pick(i);}},h('span',{class:'mk'},String.fromCharCode(65+i)),h('span',{class:o.mono?'mono':''},t));
  });
  function pick(i){
    if(solved) return;
    if(i===o.correct){solved=true;btns[i].classList.add('ok');fb.className='fb good';fb.textContent='Вірно. '+(o.explain||'');if(o.onSolved)o.onSolved();}
    else{btns[i].classList.add('no');btns[i].disabled=true;fb.className='fb bad';fb.textContent='Ще ні. '+(o.hint||'Спробуйте інший варіант.');}
  }
  return h('div',{class:'quiz'},o.prompt&&h('p',{class:'qt'},o.prompt),o.code&&codeBlock(o.code),h('div',{class:'opts'},btns),fb);
}

function simState(mode,a0,b0,step){
  var x=a0,y=b0,fa=null,fb=null,t=null,frame=false;
  if(step>=1){frame=true;if(mode==='val'){fa=a0;fb=b0;}}
  if(step>=2)t=a0;
  if(step>=3){if(mode==='val')fa=b0;else x=b0;}
